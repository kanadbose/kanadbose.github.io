  <style>
    :root {
      font-family: 'Manrope', sans-serif;
      color: #eef2f1;
      background: #a8b9b6;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    html, body, #root { width: 100%; min-height: 100%; margin: 0; padding: 0; }
    body { overflow: hidden; }
    button, a { font: inherit; color: inherit; }
    button { border: 0; cursor: pointer; }

    .portfolio-shell {
      --ink: #f5f7f6;
      --muted: rgba(245,247,246,.68);
      --line: rgba(245,247,246,.22);
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      min-height: 600px;
      overflow: hidden;
      background: #1e3d59;
      isolation: isolate;
      transition: background .7s ease;

    .portfolio-shell.is-dark {

      --line: rgba(233,238,238,.2);
      background: #25383c;

    .atmosphere {
      position: absolute;
      inset: -3%;
      z-index: -3;
      background-size: cover;
      background-position: center;
      filter: saturate(.88) contrast(1.02) brightness(1.02);
      transform: scale(1.07);
      opacity: .92;
      transition: filter .8s ease, opacity .8s ease, background-image .8s ease;
      animation: drift 22s ease-in-out infinite alternate;
    }
    .is-dark .atmosphere {
      filter: saturate(1.1) contrast(1.2) brightness(.50) hue-rotate(7deg);
      opacity: 1.00;
    }
    .atmosphere::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(42,69,71,.54), rgba(123,149,145,.16) 55%, rgba(36,58,59,.48));
    }

    .grain {
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .09;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves=[...]
      mix-blend-mode: soft-light;
    }

    /* Top Navigation Bar */
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(24px, env(safe-area-inset-top, 24px)) max(32px, env(safe-area-inset-right, 32px)) 20px max(32px, env(safe-area-inset-left, 32px));
      z-index: 30;
    }
    .wordmark {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 600;
      letter-spacing: .02em;

      border: 0;

      cursor: pointer;
      color: var(--ink);
      transition: opacity .25s ease, transform .25s ease;

    }

    .wordmark:active {

    /* Frosted Glass Toggles */
    .toggle-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 38px;
      height: 22px;
      padding: 2px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .22);
      background: rgba(255, 255, 255, .1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      cursor: pointer;
      outline: none;
      user-select: none;
      transition: background .25s ease, border-color .25s ease, transform .25s ease, box-shadow .25s ease;
    }
    .toggle-switch:hover {
      background: rgba(255, 255, 255, .22);
      border-color: rgba(255, 255, 255, .48);
      transform: translateY(-1px);
    }
    .toggle-track-icons {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5px;
      pointer-events: none;
      color: var(--muted);
      opacity: .55;
      transition: opacity .25s ease;
    }
    .toggle-switch:hover .toggle-track-icons {
      opacity: .85;
    }
    .toggle-thumb {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(10px) saturate(160%);
      -webkit-backdrop-filter: blur(10px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.85);
      color: #1a344d;
      box-shadow: inset 0 1px 1.5px rgba(255, 255, 255, 0.95), 0 2px 6px rgba(0, 0, 0, 0.22);
      transform: translateX(0);
      transition: transform .35s cubic-bezier(.16, 1, .3, 1), background .3s ease, border-color .3s ease, color .3s ease, box-shadow .3s ease;
    }
    .is-dark .toggle-thumb {
      background: rgba(18, 28, 38, 0.58);
      backdrop-filter: blur(10px) saturate(160%);
      -webkit-backdrop-filter: blur(10px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #f4f8f8;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.32), 0 2px 7px rgba(0, 0, 0, 0.52);
    }
    .toggle-switch.is-on .toggle-thumb {
      transform: translateX(16px);
    }
    .sound-toggle.is-on .toggle-thumb {
      color: #c85a2d;
    }
    .is-dark .sound-toggle.is-on .toggle-thumb {
      color: #ffffff;
    }

    .scene {

      inset: 0;

      align-items: center;

    .scene-location {

    .panel-open .scene-location {
      opacity: 0;
      pointer-events: none;
      transform: translate(-25px, -50%);
    }
    .scene-location span {
      display: block;
      width: 5px;
      height: 5px;
      border: 1px solid var(--ink);
      border-radius: 50%;

    .navigation-stage {
      width: min(600px, 42vw);
      height: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform .70s cubic-bezier(.16,1,.3,1);
      will-change: transform;
    }

    .cylinder-nav {
      position: relative;
      width: 100%;
      height: 480px;
    }

    .nav-item {
      position: absolute;
      left: 50%;
      width: 100%;
      padding: 0;
      color: rgba(255,255,255,.76);

    }
    .nav-item.is-fading-out {
      transition: top .7s cubic-bezier(.22,.8,.2,1), transform .70s cubic-bezier(.16,1,.3,1), opacity 0.2s ease, color .7s ease, filter .7s ease;
    }
    .nav-item.is-fading-in {
      transition: top .7s cubic-bezier(.22,.8,.2,1), transform .70s cubic-bezier(.16,1,.3,1), opacity 1.2s ease, color .7s ease, filter .7s ease;
    }

    .nav-item span {
      display: inline-block;
      font-family: 'SUSE Mono', 'SUSE', monospace;
      font-size: clamp(32px, 6.7vw, 96px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.025em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      backface-visibility: hidden;
      transform: translateZ(0);
      filter: none;
      /* Crisp contours with 90% luminous glow */
      text-shadow:
        0 0 20px rgba(255, 255, 255, 0.9),
        0 0 42px rgba(255, 255, 255, 0.45);
    }
    .nav-item.is-current span {
      color: #ffffff;
      filter: none;
      text-shadow:
        0 0 26px rgba(255, 255, 255, 0.9),
        0 0 56px rgba(255, 255, 255, 0.5);
    }

    .is-dark .nav-item span {
      text-shadow:
        0 0 20px rgba(255, 255, 255, 0.9),
        0 0 42px rgba(255, 255, 255, 0.45);
    }
    .is-dark .nav-item.is-current span {
      text-shadow:
        0 0 26px rgba(255, 255, 255, 0.9),
        0 0 56px rgba(255, 255, 255, 0.5);
    }

    .portfolio-shell:not(.panel-open) .nav-item:not(.is-current) span {
      font-size: clamp(25.6px, 5.36vw, 76.8px);
    }

    .language-word {
      animation: language-crossfade 1.1s cubic-bezier(.22,.8,.2,1) both;
    }
    @keyframes language-crossfade {
      0% { opacity: 0; filter: blur(6px); transform: translateY(6px) scale(.96); }
      38% { opacity: .75; filter: blur(1.5px); }
      75% { opacity: 1; filter: none; transform: translateY(0) scale(1); }
      100% { opacity: 1; filter: none; transform: translateY(0) scale(1); }
    }

    .nav-hint {

    .scroll-hint {

    .scene-index {

    .footer-bar {

    .detail-panel {

      transition: opacity 1s cubic-bezier(.16,1,.3,1), transform 1s cubic-bezier(.16,1,.3,1);
      will-change: opacity, transform;

    .panel-open .detail-panel {

    .is-closing .detail-panel {

    .panel-inner {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 26px;
      border: 1px solid rgba(255,255,255,.28);

    .panel-topline {

    .panel-cv-btn {

    .close-button {

      width: 26px;
      height: 26px;
      border: 1px solid rgba(255,255,255,.22);

      background: rgba(255,255,255,.1);
      color: var(--ink);
